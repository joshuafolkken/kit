name: Setup Node.js
description: >
  Set Node.js up at the version every kit workflow runs on, optionally pointed at a package
  registry.

# The one place the Node.js version of kit's workflows is written (joshuafolkken/kit#3084). Every
# job used to call actions/setup-node with its own `node-version` literal, so a version move had to
# find all of them. A job that needs a different runtime says so explicitly — `node-compat` in
# `ci.yml` passes its own runtime to `.github/actions/setup-pnpm` instead of calling this.
#
# Distributed: `josh sync` writes this file into a consumer beside the workflows that call it, the
# same way as `.github/actions/setup-pnpm`. `workflow_pin_logic` reads this file as a source of
# canonical action pins.

inputs:
  registry-url:
    description: Passed to actions/setup-node's `registry-url`; empty writes no `.npmrc`.
    required: false
    default: ''
  scope:
    description: Passed to actions/setup-node's `scope`, for a scoped registry.
    required: false
    default: ''

# The exact version `'24'` resolved to on this runner (joshuafolkken/kit#4346). Runner images do not
# all carry the same patch release, and ESLint folds `process.version` into every cache entry, so a
# cache restored across two patch releases is cold; the ESLint cache key names this value.
outputs:
  node-version:
    description: The Node.js version installed, as actions/setup-node reports it (e.g. `v24.22.0`).
    value: ${{ steps.setup-node.outputs.node-version }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      id: setup-node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
