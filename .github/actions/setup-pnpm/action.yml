name: Setup pnpm
description: >
  Resolve the project's pnpm version, set pnpm up, and — unless `install` is false — restore the
  pnpm store, install safe-chain from its hash-verified release installer and install the
  dependencies through it.

# The one place kit's own workflows prepare pnpm (joshuafolkken/kit#2982). Every job that installed
# dependencies used to carry these steps itself, and `publish.yml` — the workflow holding the npm
# and GitHub Packages publish rights — had been left without safe-chain while `ci.yml` had it. A
# job that calls this action cannot install without the scan.
#
# Distributed: `josh sync` writes this file into a consumer beside the workflows that call it
# (`ci.yml` and `pr-classification.yml`), stamped as managed like they are (joshuafolkken/kit#3013).
# The distributed `ci.yml` calls it exactly as kit's own does, so a consumer's CI prepares pnpm on
# the path kit's CI runs (joshuafolkken/kit#3095). `workflow_pin_logic` reads this file as a source
# of canonical action pins.

inputs:
  install:
    description: Install the dependencies. False sets pnpm up alone, for a job that only runs pnpm.
    required: false
    default: 'true'
  cache:
    description: >
      Restore and save the pnpm store and the safe-chain download. A release job passes false, so
      nothing another run saved reaches a job that holds publish credentials.
    required: false
    default: 'true'
  runtime:
    description: Passed to pnpm/setup's `runtime` input; empty leaves the runtime to setup-node.
    required: false
    default: ''
  node-auth-token:
    description: >
      NODE_AUTH_TOKEN for the install, for a job whose `.npmrc` authenticates to GitHub Packages.
      Empty keeps whatever the job already has.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve pnpm version
      id: pnpm-version
      shell: bash
      run: |
        version=$(node -p "const m = require('./package.json'); m.packageManager?.match(/^pnpm@([^+]+)/)?.[1] ?? (m.devEngines?.packageManager?.name === 'pnpm' ? m.devEngines.packageManager.version?.split('+')[0] : 'latest') ?? 'latest'")
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # The store is cached by pnpm/setup itself, keyed on the lockfile and the requested runtime and
    # restored before the runtime is installed. A separate actions/cache step restored the store
    # only after pnpm/setup had installed the runtime, so the job's runtime came from the registry
    # every run, and a download that crawled at 100 KB/s timed the job out at 10 minutes
    # (joshuafolkken/kit#5315). Caching it in pnpm's store, rather than taking Node from setup-node's
    # tool cache, keeps setup-node the one place the default Node version is written.
    - name: Setup pnpm
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        version: ${{ steps.pnpm-version.outputs.version }}
        runtime: ${{ inputs.runtime }}
        cache: ${{ inputs.install == 'true' && inputs.cache == 'true' }}
        install: false

    # The safe-chain release and the SHA-256 of that release's install-safe-chain.sh. The installer
    # puts the safe-chain binary under ~/.safe-chain/bin and adds it to PATH beside the shims;
    # `pnpm dlx … setup-ci` left only the shims, which then let every install through without a scan
    # (joshuafolkken/kit#2711). `josh latest` moves both together, and with them the cache key.
    - name: Pin safe-chain
      id: safe-chain-pin
      if: inputs.install == 'true'
      shell: bash
      env:
        SAFE_CHAIN_INSTALLER_VERSION: 1.5.27
        SAFE_CHAIN_INSTALLER_SHA256: 600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8
      run: |
        echo "version=$SAFE_CHAIN_INSTALLER_VERSION" >> "$GITHUB_OUTPUT"
        echo "sha256=$SAFE_CHAIN_INSTALLER_SHA256" >> "$GITHUB_OUTPUT"

    # The installer and the binary it fetched, so a GitHub Releases outage does not turn every job
    # red before its tests (joshuafolkken/kit#6833). Off with `cache`, like the store, so a release
    # job runs nothing another run saved (joshuafolkken/kit#4633).
    - name: Restore safe-chain
      id: safe-chain-cache
      if: inputs.install == 'true' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.safe-chain/bin
          ~/.safe-chain-installer
        key: safe-chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.safe-chain-pin.outputs.version }}-${{ steps.safe-chain-pin.outputs.sha256 }}

    # A restored installer is verified like a downloaded one; the binary's own `setup-ci` then does
    # the shims and PATH the installer's `--ci` does after its download.
    - name: Setup safe-chain
      if: inputs.install == 'true'
      shell: bash
      env:
        SAFE_CHAIN_INSTALLER_VERSION: ${{ steps.safe-chain-pin.outputs.version }}
        SAFE_CHAIN_INSTALLER_SHA256: ${{ steps.safe-chain-pin.outputs.sha256 }}
        SAFE_CHAIN_CACHE_HIT: ${{ steps.safe-chain-cache.outputs.cache-hit }}
      run: |
        installer="$HOME/.safe-chain-installer/install-safe-chain.sh"
        if [ "$SAFE_CHAIN_CACHE_HIT" = true ]; then
          echo "$SAFE_CHAIN_INSTALLER_SHA256  $installer" | sha256sum -c -
          "$HOME/.safe-chain/bin/safe-chain" setup-ci
          exit 0
        fi
        export CURL_HOME
        CURL_HOME=$(mktemp -d "$RUNNER_TEMP/safe-chain-curl.XXXXXX")
        trap 'rm -r "$CURL_HOME"' EXIT
        printf '%s\n' 'retry = 3' 'retry-delay = 2' 'retry-max-time = 60' > "$CURL_HOME/.curlrc"
        mkdir -p "${installer%/*}"
        curl --proto '=https' -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/$SAFE_CHAIN_INSTALLER_VERSION/install-safe-chain.sh" -o "$installer"
        echo "$SAFE_CHAIN_INSTALLER_SHA256  $installer" | sha256sum -c -
        sh "$installer" --ci

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token || env.NODE_AUTH_TOKEN }}
      run: pnpm install --frozen-lockfile --ignore-scripts
