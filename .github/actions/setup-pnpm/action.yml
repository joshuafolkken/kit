name: Setup pnpm
description: >
  Resolve the project's pnpm version, set pnpm up, and — unless `install` is false — restore the
  pnpm store, install the hash-verified safe-chain release and install the dependencies through
  it.

# The one place kit's own workflows prepare pnpm (joshuafolkken/kit#2982). Every job that installed
# dependencies used to carry these steps itself, and `publish.yml` — the workflow holding the npm
# and GitHub Packages publish rights — had been left without safe-chain while `ci.yml` had it. A
# job that calls this action cannot install without the scan.
#
# Distributed: `josh sync` writes this file into a consumer beside the workflows that call it
# (`ci.yml` and `pr-classification.yml`), stamped as managed like they are (joshuafolkken/kit#3013).
# The distributed `ci.yml` calls it exactly as kit's own does, so a consumer's CI prepares pnpm on
# the path kit's CI runs (joshuafolkken/kit#3095). `workflow_pin_logic` reads this file as a source
# of canonical action pins.

inputs:
  install:
    description: Install the dependencies. False sets pnpm up alone, for a job that only runs pnpm.
    required: false
    default: 'true'
  cache:
    description: >
      Restore and save the pnpm store and the safe-chain download. A release job passes false, so
      nothing another run saved reaches a job that holds publish credentials.
    required: false
    default: 'true'
  runtime:
    description: Passed to pnpm/setup's `runtime` input; empty leaves the runtime to setup-node.
    required: false
    default: ''
  node-auth-token:
    description: >
      NODE_AUTH_TOKEN for the install, for a job whose `.npmrc` authenticates to GitHub Packages.
      Empty keeps whatever the job already has.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve pnpm version
      id: pnpm-version
      shell: bash
      run: |
        version=$(node -p "const m = require('./package.json'); m.packageManager?.match(/^pnpm@([^+]+)/)?.[1] ?? (m.devEngines?.packageManager?.name === 'pnpm' ? m.devEngines.packageManager.version?.split('+')[0] : 'latest') ?? 'latest'")
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # The store is cached by pnpm/setup itself, keyed on the lockfile and the requested runtime and
    # restored before the runtime is installed. A separate actions/cache step restored the store
    # only after pnpm/setup had installed the runtime, so the job's runtime came from the registry
    # every run, and a download that crawled at 100 KB/s timed the job out at 10 minutes
    # (joshuafolkken/kit#5315). Caching it in pnpm's store, rather than taking Node from setup-node's
    # tool cache, keeps setup-node the one place the default Node version is written.
    - name: Setup pnpm
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        version: ${{ steps.pnpm-version.outputs.version }}
        runtime: ${{ inputs.runtime }}
        cache: ${{ inputs.install == 'true' && inputs.cache == 'true' }}
        install: false

    # The safe-chain release and the SHA-256 of that release's install-safe-chain.sh, which `josh
    # latest` moves together, and with them the cache key. The release asset for this runner sits
    # beside them: the installer's own `linuxstatic` / `macos` naming, so its baked digest matches.
    - name: Pin safe-chain
      id: safe-chain-pin
      if: inputs.install == 'true'
      shell: bash
      env:
        SAFE_CHAIN_INSTALLER_VERSION: 1.5.27
        SAFE_CHAIN_INSTALLER_SHA256: 600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) binary=safe-chain-linuxstatic-x64 ;;
          Linux-ARM64) binary=safe-chain-linuxstatic-arm64 ;;
          macOS-X64) binary=safe-chain-macos-x64 ;;
          macOS-ARM64) binary=safe-chain-macos-arm64 ;;
          *) echo "::error::No safe-chain binary for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        echo "version=$SAFE_CHAIN_INSTALLER_VERSION" >> "$GITHUB_OUTPUT"
        echo "sha256=$SAFE_CHAIN_INSTALLER_SHA256" >> "$GITHUB_OUTPUT"
        echo "binary=$binary" >> "$GITHUB_OUTPUT"

    # The release download, so a GitHub Releases outage does not turn every job red before its tests
    # (joshuafolkken/kit#6833). Off with `cache`, like the store, so a release job runs nothing
    # another run saved (joshuafolkken/kit#4633). What it restores is verified like a fresh download.
    - name: Restore safe-chain
      id: safe-chain-cache
      if: inputs.install == 'true' && inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.safe-chain-download
        key: safe-chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.safe-chain-pin.outputs.version }}-${{ steps.safe-chain-pin.outputs.sha256 }}

    # Through the REST API's asset path with the job token: anonymous `releases/download` returned
    # 504 throughout a GitHub outage that authenticated requests passed (joshuafolkken/kit#6849).
    # curl and node rather than `gh`, which the Playwright container some jobs run in does not carry.
    # The token stays in this step, which runs no third-party code, and in a curl config it removes;
    # curl sends it to api.github.com alone, not across the redirect to the asset's signed URL.
    - name: Fetch safe-chain
      if: inputs.install == 'true' && steps.safe-chain-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SAFE_CHAIN_INSTALLER_VERSION: ${{ steps.safe-chain-pin.outputs.version }}
        SAFE_CHAIN_BINARY: ${{ steps.safe-chain-pin.outputs.binary }}
      run: |
        export CURL_HOME
        CURL_HOME=$(mktemp -d "$RUNNER_TEMP/safe-chain-curl.XXXXXX")
        trap 'rm -r "$CURL_HOME"' EXIT
        printf '%s\n' 'retry = 3' 'retry-delay = 2' 'retry-max-time = 60' "header = \"Authorization: Bearer $GH_TOKEN\"" > "$CURL_HOME/.curlrc"
        downloads="$HOME/.safe-chain-download"
        mkdir -p "$downloads"
        release=$(curl --proto '=https' -fsSL "https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/$SAFE_CHAIN_INSTALLER_VERSION")
        for asset in install-safe-chain.sh "$SAFE_CHAIN_BINARY"; do
          url=$(printf '%s' "$release" | node -e 'const { assets } = JSON.parse(require("node:fs").readFileSync(0, "utf8")); const asset = assets.find((candidate) => candidate.name === process.argv[1]); if (asset === undefined) process.exit(1); console.log(asset.url)' "$asset")
          curl --proto '=https' -fsSL -H 'Accept: application/octet-stream' "$url" -o "$downloads/$asset"
        done

    # The installer is checked against the pin, then the binary against the digest the release
    # pipeline baked into that verified installer, so neither is used unverified. The installer is
    # not run: on a fresh runner its `--ci` does no more than place the binary and run `setup-ci`,
    # which this step does itself. The binary directory goes on PATH beside the shims, since shims
    # without a reachable binary let every install through without a scan (joshuafolkken/kit#2711).
    - name: Setup safe-chain
      if: inputs.install == 'true'
      shell: bash
      env:
        SAFE_CHAIN_INSTALLER_SHA256: ${{ steps.safe-chain-pin.outputs.sha256 }}
        SAFE_CHAIN_BINARY: ${{ steps.safe-chain-pin.outputs.binary }}
      run: |
        downloads="$HOME/.safe-chain-download"
        installer="$downloads/install-safe-chain.sh"
        echo "$SAFE_CHAIN_INSTALLER_SHA256  $installer" | sha256sum -c -
        platform=$(printf '%s' "${SAFE_CHAIN_BINARY#safe-chain-}" | tr 'a-z-' 'A-Z_')
        binary_sha256=$(sed -n "s/^SHA256_${platform}=\"\([0-9a-f]\{64\}\)\"\$/\1/p" "$installer")
        test -n "$binary_sha256"
        echo "$binary_sha256  $downloads/$SAFE_CHAIN_BINARY" | sha256sum -c -
        mkdir -p "$HOME/.safe-chain/bin"
        install -m 755 "$downloads/$SAFE_CHAIN_BINARY" "$HOME/.safe-chain/bin/safe-chain"
        "$HOME/.safe-chain/bin/safe-chain" setup-ci
        echo "$HOME/.safe-chain/bin" >> "$GITHUB_PATH"

    - name: Save safe-chain
      if: inputs.install == 'true' && inputs.cache == 'true' && steps.safe-chain-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.safe-chain-download
        key: ${{ steps.safe-chain-cache.outputs.cache-primary-key }}

    # Keep legacy and unrelated GitHub scopes working without authenticating npm-only installs.
    - name: Configure package registry authentication
      id: registry-auth
      if: inputs.install == 'true'
      shell: bash
      run: |
        if [ -f .npmrc ] && grep -Eq '^[[:space:]]*@[^:]+:registry[[:space:]]*=[[:space:]]*https://npm[.]pkg[.]github[.]com/?[[:space:]]*$' .npmrc; then
          if [ ! -f "$HOME/.npmrc" ] || ! grep -Eq '^[[:space:]]*//npm[.]pkg[.]github[.]com/:_authToken[[:space:]]*=' "$HOME/.npmrc"; then
            printf '\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' >> "$HOME/.npmrc"
          fi
          echo 'required=true' >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token || env.NODE_AUTH_TOKEN || (steps.registry-auth.outputs.required == 'true' && github.token) || '' }}
      run: pnpm install --frozen-lockfile --ignore-scripts
