version: 2
updates:
  # The local composite actions pin actions of their own, and Dependabot reads only the directories
  # it is given — `/` covers `.github/workflows` and no `.github/actions/*/action.yml`.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    # One pull request for every minor and patch bump. Separate pull requests that touch the same
    # workflow file leave the later merge writing workflow content its head does not hold, which
    # `GITHUB_TOKEN` may not, so GitHub withdraws its auto-merge (joshuafolkken/kit#4148). kit's own
    # file only: the distributed `templates/dependabot.yml` stays ungrouped, because a consumer's
    # auto-merge holds a whole pull request that touches an upstream-managed workflow.
    #
    # The actions the publish jobs run with publish credentials come first, in a pull request of their
    # own: `.github/workflows/dependabot-auto-merge.yml` merges only the `github-actions` group, so a
    # person reviews each bump of these (joshuafolkken/kit#4633). This list is the only one.
    groups:
      publish-actions:
        patterns:
          - 'actions/checkout'
          - 'actions/download-artifact'
          - 'actions/setup-node'
        update-types:
          - 'minor'
          - 'patch'
      github-actions:
        update-types:
          - 'minor'
          - 'patch'
    cooldown:
      default-days: 3
  # Version updates are disabled: `josh latest` runs at the start of every fullrun / halfrun /
  # queue and already bumps npm dependencies to latest, so Dependabot's weekly PRs only duplicate
  # it and were being closed unmerged after consuming a full CI run. `open-pull-requests-limit: 0`
  # disables version updates only — security update PRs "are not subject to this limit and do not
  # count toward it" (GitHub's Dependabot options reference), so an advisory still opens a PR,
  # which is the one case `josh latest` does not cover on its own. That fallback needs Dependabot
  # security updates enabled on the repository (Settings > Advanced Security); without it this file
  # leaves no npm Dependabot PRs at all. See joshuafolkken/kit#803.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 3
      exclude:
        - 'vite'
