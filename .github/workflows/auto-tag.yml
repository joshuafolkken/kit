name: Auto Tag on Version Change

on:
  repository_dispatch:
    types: [ci-passed-on-main]

jobs:
  create-tag:
    name: Create Git Tag if Version Changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      # The dispatch payload is only a claim: any holder of a contents:write token can send
      # ci-passed-on-main with any sha, including a commit main's branch protection never saw
      # (joshuafolkken/kit#4651). Only a commit main contains, whose push-event CI run reached its
      # Notify Auto Tag job, is tagged — that job runs only once every check it needs has passed.
      - name: Verify the dispatched commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ci-passed-on-main carried no full commit sha: $SHA" >&2
            exit 1
          fi

          STATUS=$(gh api "repos/$GH_REPO/compare/main...$SHA" --jq '.status')
          if [ "$STATUS" != "identical" ] && [ "$STATUS" != "behind" ]; then
            echo "::error::$SHA is not on main (compare status: $STATUS)" >&2
            exit 1
          fi

          RUN_IDS=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main" --jq '.workflow_runs[].id')
          for RUN_ID in $RUN_IDS; do
            if gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name == "Notify Auto Tag") | "\(.status)/\(.conclusion)"' | grep -Eqx 'in_progress/null|completed/success'; then
              echo "✅ $SHA is on main and passed CI run $RUN_ID"
              exit 0
            fi
          done

          echo "::error::No push-event CI run on main passed for $SHA" >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 2
          persist-credentials: false

      # No Node.js setup: this job installs nothing and reads package.json with jq, which the runner
      # image ships, so a Node.js version step would only add time (joshuafolkken/kit#3326).
      - name: Check if package.json changed
        id: pkg_changed
        run: |
          if git diff HEAD~1 --name-only | grep -q '^package.json$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ package.json changed in this commit"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ package.json not changed, skipping tag creation"
          fi

      - name: Get current version
        id: current_version
        if: steps.pkg_changed.outputs.changed == 'true'
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version changed
        id: version_check
        if: steps.pkg_changed.outputs.changed == 'true'
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
        run: |
          if git show HEAD~1:package.json > /dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD~1:package.json | jq -r '.version')
            echo "Previous version: $PREV_VERSION"
            echo "Current version: $CURRENT_VERSION"

            if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "✅ Version changed from $PREV_VERSION to $CURRENT_VERSION"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "ℹ️ Version unchanged: $CURRENT_VERSION"
            fi
          else
            # first commit
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "ℹ️ First commit, creating tag"
          fi

      - name: Check if tag already exists
        id: tag_check
        if: steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.current_version.outputs.version }}
        run: |
          TAG="v$VERSION"

          # The checkout keeps no credentials, so the token reaches git for this step only, through
          # the environment rather than .git/config; a private repository needs it to fetch.
          BASIC=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$BASIC"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $BASIC"

          # Shallow checkout (fetch-depth: 2) does not fetch tags, so the existence
          # check would miss tags that already exist on the remote. Fetch them first.
          git fetch origin --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG already exists, skipping tag creation"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $TAG does not exist, will create it"
          fi

      - name: Create and push tag
        id: create_tag
        if: steps.version_check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.current_version.outputs.version }}
        run: |
          TAG="v$VERSION"

          BASIC=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$BASIC"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $BASIC"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release version $VERSION"
          git push origin "$TAG"

          echo "✅ Created and pushed tag: $TAG"
          echo "completed=true" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Trigger next workflow
        if: steps.create_tag.outputs.completed == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          event-type: new-tag-created
          client-payload: '{"tag": "${{ steps.create_tag.outputs.tag }}"}'

      # A publish workflow run on the tag ref records the tag's commit in npm provenance; a
      # repository_dispatch run records the default branch head, which may already be past the tag.
      # A publish.yml that still listens for new-tag-created is left to the dispatch above, so one
      # release never starts two publish runs. This step runs after that dispatch so its failure
      # cannot keep the dispatch from reaching production.yml.
      - name: Start publish workflow on the tag
        if: steps.create_tag.outputs.completed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.create_tag.outputs.tag }}
        run: |
          WORKFLOW=.github/workflows/publish.yml
          if [ -f "$WORKFLOW" ] && grep -Eq '^[[:space:]]*workflow_dispatch:' "$WORKFLOW" && ! grep -q 'new-tag-created' "$WORKFLOW"; then
            gh workflow run publish.yml --ref "$TAG"
            echo "✅ Started publish.yml on $TAG"
          else
            echo "ℹ️ publish.yml is not a workflow_dispatch-only publisher, skipping"
          fi
