name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Which browsers the plain-runner fallback downloads when the MCR image could not be resolved.
# chromium is the default because that is the single project this repository's config declares;
# set the JOSH_PLAYWRIGHT_BROWSERS repository variable to a space-separated list to widen it.
env:
  JOSH_PLAYWRIGHT_BROWSERS: ${{ vars.JOSH_PLAYWRIGHT_BROWSERS || 'chromium' }}

jobs:
  playwright-image:
    name: Resolve Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      # JSON consumed via fromJSON() as the job-level `container` value: an object
      # when the image exists, the literal `null` when it does not (= no container).
      container: ${{ steps.resolve.outputs.container }}
      # 'true' only when Playwright is a dependency but its image is unavailable, i.e.
      # exactly when a job must download browsers itself.
      should_install_browsers: ${{ steps.resolve.outputs.should_install_browsers }}
      # The browser names the e2e job passes to `playwright install`, sanitized here so one
      # place decides both the list and what may reach a command line.
      browsers: ${{ steps.resolve.outputs.browsers }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The MCR image lags the npm publish by days, so a version-derived tag is not
      # guaranteed to exist. Probe it first and fall back to a plain runner instead of
      # emitting a tag that 404s and kills every dependent job before it starts.
      - name: Resolve image
        id: resolve
        run: |
          # Whitelist the characters: the value lands in $GITHUB_OUTPUT as JSON, so a
          # newline or quote smuggled into the lockfile could forge an extra output line.
          version=$(grep -m1 "'@playwright/test@" pnpm-lock.yaml | sed "s/.*'@playwright\/test@//" | sed "s/':.*//" | tr -cd 'A-Za-z0-9.-')

          # Sanitized once, here, for the install step below: the value comes from repository
          # settings and is interpolated into its command line, so only letters, dashes and the
          # spaces between them survive. Uppercase is kept on purpose — a mistyped `Chromium`
          # then reaches Playwright as an unknown browser and fails at the install step, where
          # the mistake is, rather than being silently narrowed to chromium.
          set -- $(printf '%s' "${JOSH_PLAYWRIGHT_BROWSERS}" | tr -cd 'A-Za-z -')
          # Never empty: `playwright install` with no browser named fetches chromium *and*
          # firefox *and* webkit plus ffmpeg, roughly 1 GB, which is the download this avoids.
          [ "$#" -gt 0 ] || set -- chromium
          browsers="$*"
          echo "browsers=${browsers}" >> "$GITHUB_OUTPUT"

          if [ -z "${version}" ]; then
            echo 'container=null' >> "$GITHUB_OUTPUT"
            echo 'should_install_browsers=false' >> "$GITHUB_OUTPUT"
            echo 'Playwright is not a dependency; every job runs on the plain runner.'
            exit 0
          fi

          tag="v${version}-noble"
          image="mcr.microsoft.com/playwright:${tag}"
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://mcr.microsoft.com/v2/playwright/manifests/${tag}" || true)

          if [ "${status}" = '200' ]; then
            printf 'container={"image":"%s","options":"--user root"}\n' "${image}" >> "$GITHUB_OUTPUT"
            echo 'should_install_browsers=false' >> "$GITHUB_OUTPUT"
            echo "Resolved Playwright container image ${image}."
          else
            echo 'container=null' >> "$GITHUB_OUTPUT"
            echo 'should_install_browsers=true' >> "$GITHUB_OUTPUT"
            echo "::warning::Playwright image ${image} could not be resolved on MCR (HTTP ${status}). Running on the plain runner and installing ${browsers} instead (set the JOSH_PLAYWRIGHT_BROWSERS repository variable to change the list)."
          fi

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      # Install pnpm via Corepack (driven by the packageManager pin) instead of
      # pnpm/action-setup: its self-installer crashes on newer pnpm releases with
      # "Cannot use 'in' operator to search for 'integrity' in undefined" (#662).
      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Setup pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: eslint-cache
        with:
          path: |
            .eslintcache
          # joshuafolkken/kit#1347: the config inputs are `.js`, and the glob used to name `.ts` — which
          # in `eslint/` is only the test files. So a rule edit left the key unchanged while a test edit
          # busted it, the exact inverse of what invalidates a cache entry. The fingerprint in
          # `eslint/config-fingerprint.js` now invalidates the entries themselves; this key has to move
          # with it, or a rule edit would restore a cache whose every entry is stale, lint cold, and
          # save nothing back under the key it already hit — a cold lint on every later run.
          key: ${{ runner.os }}-eslint-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('eslint.config.js', 'eslint/**/*.js') }}
          restore-keys: |
            ${{ runner.os }}-eslint-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-eslint-cache-

      - name: Setup safe-chain
        run: pnpm dlx @aikidosec/safe-chain@1.5.1 setup-ci

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      # One step rather than five, and concurrent rather than serial (joshuafolkken/kit#1216).
      # `josh gate` is the command a developer runs before committing; it fans out to the same
      # `josh` sub-commands that define each check — `lint` (prettier and eslint), `check` (the
      # type check), `cspell:dot`, `test:unit` — so nothing here restates a tool invocation and CI
      # cannot verify a different set from the local gate. Measured on this repository the five
      # steps took 78–162 seconds end to end while the longest of them takes a fraction of that;
      # the serial time was pure waiting, and it sat on the critical path between the pull request
      # opening and the merge.
      #
      # **Every failure is reported in one pass.** The serial form stopped at the first red step,
      # so a tree with a lint error and a type error cost two full CI runs to discover. The gate
      # buffers each check and prints them all, failures with their whole output, which is the
      # property `josh gate` was written for and the reason the five steps are not merely
      # run in the background here.
      #
      # `--verbose` prints every check's body, not only the failing ones. Locally the quiet form is
      # right — the gate runs many times per issue and the bodies pile up in the conversation — but a
      # CI log is read once, after the fact, by someone who cannot re-run it: the unit summary's test
      # count is what says the suite actually ran, and without it a green log looks the same whether
      # vitest executed six thousand tests or none.
      #
      # **The unit step goes through `josh test:unit`, which skips rather than fails when vitest is
      # absent or nothing matches the test glob.** That is deliberate and not new — the distributed
      # `templates/workflows/ci.yml` has routed through the same guard for exactly this reason, and
      # `scripts/ci-yml-unit-step.test.ts` pins it; this repository's own workflow was the one
      # calling vitest directly. The skip prints its notice either way, and `--verbose` is what keeps
      # the count beside it.
      #
      # Two things are given up. GitHub's per-step timing and log grouping: the run shows one `Run
      # verification gate` step instead of five named ones, and the gate's own summary names which
      # check failed, which is what the grouping was being read for. And each check's output is
      # buffered until it exits, so a check that *hangs* until this job's `timeout-minutes` is
      # cancelled with nothing printed — where a serial step streamed. That costs one local
      # `pnpm josh gate` to identify, and it is the price of the all-failures-in-one-pass summary.
      - name: Run verification gate
        run: pnpm josh gate --verbose

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run security audit
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: --lockfile=pnpm-lock.yaml

  e2e-detect:
    name: Detect E2E
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same rule `scripts/test-e2e-guard.ts` applies locally, so a suite that runs under
      # `pnpm josh test:e2e` is a suite CI runs too. Every `*.e2e.{ts,js}` outside `node_modules`
      # counts, at any depth; the guard's glob leaves dot-directories out by default, which is what
      # the second prune term reproduces. The config filename is deliberately not consulted any
      # more. Playwright accepts `playwright.config.js` as readily as `.ts`, and requiring one
      # spelling made a project using the other read as "no E2E": the job's `if:` went false,
      # GitHub recorded it as skipped, the status-check list counted the skip as a pass, and the
      # merge went through with the suite never run. The same held for a spec kept anywhere but
      # `tests` or `src/routes` (joshuafolkken/kit#991). The agreement is executed rather than
      # asserted in prose: `scripts/ci-yml-e2e-detect.test.ts` runs this very script against
      # fixtures and compares its verdict to the guard's.
      #
      # One difference from the guard is deliberate and one-sided. The guard also skips when
      # `@playwright/test` is not installed, which is what keeps that optional peer optional for
      # the pre-push hook; here a spec enables the job whatever the manifest says, so a spec that
      # cannot run ends red instead of silently green. Enabling more than the guard is safe —
      # enabling less is the defect above, so no condition may be added that narrows this.
      #
      # Deliberately not `find ... | grep -q .`: `grep -q` exits on the first match and leaves
      # `find` to be killed by the closed pipe, which is invisible under the default `bash -e` and
      # decides the whole question under `bash -eo pipefail` — the shell GitHub selects for a step
      # that declares `shell: bash`, or for every step once a `defaults: run: shell: bash` block is
      # added at workflow or job level. The pipeline's status would then be 141, the `else` branch
      # would be taken, and a repository full of specs would emit `enabled=false`: this defect
      # again, reintroduced by a shell detail. Command substitution has no pipeline to
      # fail, and `-print -quit` stops the walk at the first spec instead of enumerating the tree.
      - name: Detect E2E specs
        id: check
        run: |
          if [ -n "$(find . -mindepth 1 \( -name node_modules -o -name '.*' \) -prune \
            -o \( -name '*.e2e.ts' -o -name '*.e2e.js' \) -print -quit)" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E
    needs: [playwright-image, e2e-detect]
    if: needs.e2e-detect.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container: ${{ fromJSON(needs.playwright-image.outputs.container) }}
    timeout-minutes: 10
    # Better Auth rejects any origin its BETTER_AUTH_URL does not name, so this job pins the value
    # to the preview server the suite talks to rather than letting a production value reach it.
    # It has to be the port that server listens on. 4173 is correct because `PORT_SEED` — the
    # personal offset `playwright.config.ts` resolves the preview port from — is not committed (it
    # lives in a gitignored `.env`) and is not set anywhere in this workflow, so the port resolves
    # to its base on every CI run. That is the invariant, not a constant in `playwright.config.ts`:
    # the port there is seed-derived. The one setting that would move the port and leave this URL
    # behind is an `env` entry for the seed in this file, at workflow or job level. A repository or
    # organization variable would not: it reaches a step only through an explicit `vars.PORT_SEED`
    # expression, and nothing here writes one. For a seeded CI job, derive this URL from
    # `josh port preview` in the same job instead.
    env:
      BETTER_AUTH_URL: http://localhost:4173
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      # Install pnpm via Corepack (driven by the packageManager pin) instead of
      # pnpm/action-setup: its self-installer crashes on newer pnpm releases with
      # "Cannot use 'in' operator to search for 'integrity' in undefined" (#662).
      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Setup pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build-cache
        with:
          path: |
            .svelte-kit
          key: ${{ runner.os }}-build-cache-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('svelte.config.js', 'vite.config.ts', 'tsconfig.json', 'src/lib/server/auth.ts') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-cache-e2e-

      - name: Setup safe-chain
        run: pnpm dlx @aikidosec/safe-chain@1.5.1 setup-ci

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Only needed on the fallback path: the container image already ships browsers
      # matching its own Playwright version. Invoked through the local bin rather than
      # `pnpm exec` because Sonar's S6505 misreads `pnpm ... install` as a package
      # install missing --ignore-scripts (this downloads browser binaries, not packages).
      # Named rather than left to the default, which downloads every browser Playwright ships
      # (~1 GB) where this config drives one of them. Left unquoted below so a multi-browser list
      # splits into arguments; the resolve job already whitelisted it, so nothing but browser
      # names can reach the command line.
      - name: Install Playwright browsers
        if: needs.playwright-image.outputs.should_install_browsers == 'true'
        env:
          PLAYWRIGHT_BROWSERS: ${{ needs.playwright-image.outputs.browsers }}
        run: ./node_modules/.bin/playwright install --with-deps ${PLAYWRIGHT_BROWSERS}

      - name: Build application
        env:
          E2E_CLEANUP_ENABLED: '1'
        run: pnpm build

      - name: Run E2E tests
        run: pnpm test:e2e

      # continue-on-error because the step exists to collect evidence, and collecting evidence must
      # not be what decides the release: it runs on always(), so a transient artifact-service error
      # would end the job red on a run whose tests passed, skipping the auto-tag dispatch below and
      # withholding kit's own release (#809). The step's outcome stays `failure`, so it is still
      # marked red on the run and a missing report is never silent. This job is skipped while kit
      # ships no E2E specs; the guard is here so adding one cannot quietly turn the gap live.
      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  notify-auto-tag:
    name: Notify Auto Tag
    needs: [checks, security, e2e-detect, e2e]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.checks.result == 'success' &&
      needs.security.result == 'success' &&
      needs.e2e-detect.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dispatch auto-tag
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          event-type: ci-passed-on-main
          client-payload: '{"sha": "${{ github.sha }}"}'
