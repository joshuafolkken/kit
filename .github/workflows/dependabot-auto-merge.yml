name: Dependabot auto-merge

on: pull_request

# One run per pull request, superseded ones cancelled. `ci.yml` groups its pull-request runs the
# same way but no longer its pushes: since joshuafolkken/kit#1481 it appends the commit sha on a
# `push` event, which this workflow — triggered by `pull_request` alone — has no use for. A stale run
# cannot arm behind the withdrawal below: its `--match-head-commit` is refused once the branch moved
# (joshuafolkken/kit#842 is about the distributed copy), so here the group only keeps a
# force-pushed bump from paying for two runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gated on who opened the pull request rather than on who triggered the run, the same job gate as
  # the distributed copy; arming stays restricted to Dependabot's own events, on the step below. The
  # write rights are granted to this job alone (joshuafolkken/kit#3268).
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The author gate also runs the job on a maintainer's push to a Dependabot branch, where this
      # action fails because the first commit is no longer Dependabot's. Contained as in the
      # distributed copy: the outputs stay empty, so the arming step below is simply not reached.
      - name: Fetch Dependabot metadata
        id: metadata
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      # `dependency-type` cannot separate the ecosystems: Dependabot reports github-actions updates
      # as `direct:production`, the same value it reports for kit's npm production dependencies, so
      # `package-ecosystem` is the only usable discriminator (kit#802).
      #
      # github-actions patch and minor bumps merge unattended because these are the SHA pins
      # `josh sync` distributes — keeping them current at the source is the intended flow.
      #
      # This is the one place where kit's own workflow and the copy consumers receive diverge in
      # behavior rather than in wording. Here `.github/workflows/*` IS the source, so a bump merged
      # here is the update every consumer then receives. In a consumer the same files are overwritten
      # from the installed kit package on the next `josh sync`, so merging a bump to one of them only
      # starts a merge/revert loop — `templates/workflows/dependabot-auto-merge.yml` therefore carries
      # an extra step that skips those paths, and must not be mirrored back into this file
      # (joshuafolkken/kit#836).
      #
      # npm bumps never auto-merge, at any semver level: kit publishes lint plugins as runtime
      # dependencies, so a patch release can change rule behavior for every consumer while kit's own
      # CI only proves that kit still builds. Major bumps never auto-merge in either ecosystem.
      #
      # Only the `github-actions` group merges: `.github/dependabot.yml` puts the actions the publish
      # jobs run with publish credentials, and those of the `pack` job that builds the tarball they
      # publish, in a group of their own, because a hijacked release of one would publish with valid
      # provenance, so a person reviews it (joshuafolkken/kit#4633, joshuafolkken/kit#4654). An
      # ungrouped pull request does not merge either, so a bump that escapes both groups is reviewed.
      #
      # `--match-head-commit` refuses to arm when the branch moved after the event this run was
      # triggered for, so a commit pushed before the arming does not merge on the bump's metadata. A
      # push after the arming is the withdrawal step's (joshuafolkken/kit#4654).
      - name: Enable auto-merge for github-actions patch and minor updates
        if: >-
          github.actor == 'dependabot[bot]'
          && steps.metadata.outputs.package-ecosystem == 'github_actions'
          && steps.metadata.outputs.dependency-group == 'github-actions'
          && (steps.metadata.outputs.update-type == 'version-update:semver-patch'
          || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"

      # The arming only binds the head it was made on: GitHub keeps auto-merge on through a later push,
      # so a commit a collaborator pushes to the branch would merge on the bump's metadata. A push by
      # anyone but Dependabot therefore withdraws the arming this workflow made (joshuafolkken/kit#4691).
      # Only that one: an auto-merge a maintainer enabled by hand — before their push or after it — is
      # their decision, and the step reads who enabled it to leave it alone.
      #
      # `--disable-auto` is an error on a pull request with nothing armed, so the state is read first;
      # a read that fails falls through to the withdrawal rather than past it, and a withdrawal that
      # still fails after its retries leaves the run red. GraphQL names the token's identity
      # `github-actions`; the REST spelling is accepted too.
      - name: Withdraw this workflow's auto-merge after a push by anyone but Dependabot
        id: withdraw
        if: github.actor != 'dependabot[bot]'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # A variable so the unit test that runs this script can set the delay to zero.
          RETRY_ATTEMPTS: '3'
          RETRY_BACKOFF_SECONDS: '5'
          GH_TOKEN: ${{ github.token }}
        run: |
          enabler="$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq '.autoMergeRequest.enabledBy.login // ""')" || enabler=unknown

          case "$enabler" in
            '')
              echo 'Auto-merge is not enabled — nothing to withdraw.'
              exit 0
              ;;
            github-actions | 'github-actions[bot]' | unknown) ;;
            *)
              echo "Auto-merge was enabled by $enabler — leaving their decision as it is."
              exit 0
              ;;
          esac

          attempt=1

          until gh pr merge --disable-auto "$PR_URL"; do
            if [ "$attempt" -ge "$RETRY_ATTEMPTS" ]; then
              exit 1
            fi

            sleep "$((attempt * RETRY_BACKOFF_SECONDS))"
            attempt=$((attempt + 1))
          done
