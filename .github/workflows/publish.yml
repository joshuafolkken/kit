name: Publish
run-name: Publish ${{ github.ref_name }}

# auto-tag.yml starts this workflow with `gh workflow run publish.yml --ref <tag>`, so the run's
# commit and ref are the release tag's. npm provenance records the run's commit from the OIDC token,
# and a repository_dispatch run is pinned to the default branch head, which can be newer than the tag.
on:
  workflow_dispatch:

# The jobs holding the publish rights install nothing and run no repository code: a compromised
# dependency would otherwise publish with valid provenance (joshuafolkken/kit#4633). Every install
# and every `tsx` run happens in `pack`, which holds no credentials, behind the same hash-verified
# safe-chain scan as CI (joshuafolkken/kit#2982). Its store cache is off: a cache entry another run
# saved never reaches the tarball the publish jobs receive.

jobs:
  # The package is built once, here, and both registries receive this one tarball: a job that built
  # its own copy could publish different bytes under the same version (joshuafolkken/kit#3268). The
  # job holds no publish credentials, so the build runs without any.
  pack:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # One dist-tag for both registries, chosen against npmjs, whose `latest` needs no credentials to
    # read: both receive the same tarball in the same run, so they move in step. `pack` runs outside
    # the `package-publish` queue, so the publish jobs re-check `latest` against its choice (see there).
    outputs:
      tag: ${{ steps.publish-tag.outputs.tag }}
      version: ${{ steps.publish-tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      # Read before setup-pnpm puts the safe-chain shims on PATH: safe-chain hides recent versions from
      # registry metadata and prints a notice to stdout, which corrupts the value (joshuafolkken/kit#3060).
      - name: Read registry latest
        id: registry-latest
        run: |
          latest=$(cd "$(mktemp -d)" && npm view @joshuafolkken/kit dist-tags.latest --registry https://registry.npmjs.org)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-pnpm
        with:
          cache: 'false'

      - name: Select publish tag
        id: publish-tag
        run: |
          version=$(node -p "require('./package.json').version")
          tag=$(pnpm exec tsx scripts/release/publish-tag-cli.ts "$version" "$LATEST")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          LATEST: ${{ steps.registry-latest.outputs.latest }}

      - run: pnpm pack --out "$RUNNER_TEMP/kit.tgz"

      # Kept as long as GitHub lets a run be re-run, so re-running a failed publish job still finds
      # the tarball instead of forcing a full re-run that republishes an existing version.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-package
          path: ${{ runner.temp }}/kit.tgz
          if-no-files-found: error
          retention-days: 30

  publish-github:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: package-publish
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@joshuafolkken'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-package
          path: ${{ runner.temp }}

      # `pack` chose `latest` outside this queue, so another tag's run may have moved npmjs' `latest`
      # since: publishing then could move it back to an older version (joshuafolkken/kit#2660). The
      # choice stays valid while npmjs' `latest` is not above this run's version, so an older tag's
      # run publishing in between does not stop this one; a newer one stops the job before it
      # publishes, and re-running all jobs chooses again. `sort -V` ranks a prerelease above its
      # release, which can only stop a valid run, never let a stale one through. `backfill` needs no
      # check: a later `latest` is never lower than the one `pack` read. The lookup runs in an empty
      # directory with the user config skipped: setup-node writes its scoped GitHub Packages registry to
      # `$RUNNER_TEMP/.npmrc`, which npm reads as the project config from there (joshuafolkken/kit#5376).
      - name: Confirm npm latest is not newer
        if: needs.pack.outputs.tag == 'latest'
        run: |
          latest=$(cd "$(mktemp -d)" && npm view @joshuafolkken/kit dist-tags.latest --registry https://registry.npmjs.org --userconfig /dev/null)
          if ! printf '%s\n%s\n' "$latest" "$VERSION" | sort -V -C; then
            echo "::error::npm latest moved to $latest, above $VERSION, after pack chose the tag; re-run all jobs"
            exit 1
          fi
        env:
          VERSION: ${{ needs.pack.outputs.version }}

      # The tag reaches the command through the environment rather than expanded into it, so a step
      # output is never parsed as shell (joshuafolkken/kit#3084). setup-node's user config carries
      # the GitHub Packages token, so it is kept here.
      - name: Publish to GitHub Packages
        run: cd "$RUNNER_TEMP" && npm publish kit.tgz --tag "$PUBLISH_TAG" --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TAG: ${{ needs.pack.outputs.tag }}

  publish-npm:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: package-publish
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node
        with:
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-package
          path: ${{ runner.temp }}

      # The same check as publish-github's, for the same reason.
      - name: Confirm npm latest is not newer
        if: needs.pack.outputs.tag == 'latest'
        run: |
          latest=$(cd "$(mktemp -d)" && npm view @joshuafolkken/kit dist-tags.latest --registry https://registry.npmjs.org --userconfig /dev/null)
          if ! printf '%s\n%s\n' "$latest" "$VERSION" | sort -V -C; then
            echo "::error::npm latest moved to $latest, above $VERSION, after pack chose the tag; re-run all jobs"
            exit 1
          fi
        env:
          VERSION: ${{ needs.pack.outputs.version }}

      - name: Publish to npm
        run: cd "$RUNNER_TEMP" && npm publish kit.tgz --access public --tag "$PUBLISH_TAG" --registry https://registry.npmjs.org --userconfig /dev/null
        env:
          PUBLISH_TAG: ${{ needs.pack.outputs.tag }}

  update-production:
    needs: [publish-github, publish-npm]
    permissions:
      contents: write
    uses: ./.github/workflows/production.yml
    with:
      tag: ${{ github.ref_name }}

  create-release:
    needs: [publish-github, publish-npm, update-production]
    runs-on: ubuntu-latest
    # `josh release:github` waits up to 60 minutes (120 polls, 30 seconds apart) for lower tags'
    # releases, which can sit queued behind `package-publish`; the extra 5 minutes cover the setup
    # before it. Lower this only together with that wait budget.
    timeout-minutes: 65
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-pnpm
        with:
          cache: 'false'

      # Tags through v1.887.0 predate automatic GitHub Releases and must not block the first new one.
      - name: Publish GitHub Release
        run: pnpm josh release:github
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_START_TAG: v1.887.0
          RELEASE_WORKFLOW: publish.yml
          RELEASE_JOBS: pack,publish-github,publish-npm,update-production
          # This run creates its tag's release, so a lower tag whose run finished without one is lost.
          RELEASE_RUN_WORKFLOW: publish.yml
