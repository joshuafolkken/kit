name: Publish
run-name: Publish ${{ github.ref_name }}

# auto-tag.yml starts this workflow with `gh workflow run publish.yml --ref <tag>`, so the run's
# commit and ref are the release tag's. npm provenance records the run's commit from the OIDC token,
# and a repository_dispatch run is pinned to the default branch head, which can be newer than the tag.
on:
  workflow_dispatch:

# Every job installs through `.github/actions/setup-pnpm`, so the jobs holding the publish rights
# install behind the same hash-verified safe-chain scan as CI (joshuafolkken/kit#2982). The store
# cache is off here: a cache entry another run saved never reaches a job with publish credentials.

jobs:
  # The package is built once, here, and both registries receive this one tarball: a job that built
  # its own copy could publish different bytes under the same version (joshuafolkken/kit#3268). The
  # job holds no publish credentials, so the build runs without any.
  pack:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-pnpm
        with:
          cache: 'false'

      - run: pnpm pack --out "$RUNNER_TEMP/kit.tgz"

      # Kept as long as GitHub lets a run be re-run, so re-running a failed publish job still finds
      # the tarball instead of forcing a full re-run that republishes an existing version.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-package
          path: ${{ runner.temp }}/kit.tgz
          if-no-files-found: error
          retention-days: 30

  publish-github:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: package-publish
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@joshuafolkken'

      # Read before setup-pnpm puts the safe-chain shims on PATH: safe-chain hides recent versions from
      # registry metadata and prints a notice to stdout, which corrupts the value (joshuafolkken/kit#3060).
      - name: Read registry latest
        id: registry-latest
        run: |
          latest=$(cd "$RUNNER_TEMP" && npm view @joshuafolkken/kit dist-tags.latest --registry https://npm.pkg.github.com)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-pnpm
        with:
          cache: 'false'

      - name: Select GitHub Packages tag
        id: publish-tag
        run: |
          version=$(node -p "require('./package.json').version")
          tag=$(pnpm exec tsx scripts/release/publish-tag-cli.ts "$version" "$LATEST")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          LATEST: ${{ steps.registry-latest.outputs.latest }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kit-package
          path: ${{ runner.temp }}

      # The tag reaches the command through the environment rather than expanded into it, so a step
      # output is never parsed as shell (joshuafolkken/kit#3084). setup-node's user config carries
      # the GitHub Packages token, so it is kept here.
      - name: Publish to GitHub Packages
        run: cd "$RUNNER_TEMP" && npm publish kit.tgz --tag "$PUBLISH_TAG" --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TAG: ${{ steps.publish-tag.outputs.tag }}

  publish-npm:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: package-publish
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node
        with:
          registry-url: 'https://registry.npmjs.org'

      # Before setup-pnpm, for the same reason as publish-github's lookup (joshuafolkken/kit#3060).
      - name: Read registry latest
        id: registry-latest
        run: |
          latest=$(cd "$RUNNER_TEMP" && npm view @joshuafolkken/kit dist-tags.latest --registry https://registry.npmjs.org)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-pnpm
        with:
          cache: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kit-package
          path: ${{ runner.temp }}

      - name: Select npm tag
        id: publish-tag
        run: |
          version=$(node -p "require('./package.json').version")
          tag=$(pnpm exec tsx scripts/release/publish-tag-cli.ts "$version" "$LATEST")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          LATEST: ${{ steps.registry-latest.outputs.latest }}

      - name: Publish to npm
        run: cd "$RUNNER_TEMP" && npm publish kit.tgz --access public --tag "$PUBLISH_TAG" --registry https://registry.npmjs.org --userconfig /dev/null
        env:
          PUBLISH_TAG: ${{ steps.publish-tag.outputs.tag }}

  update-production:
    needs: [publish-github, publish-npm]
    permissions:
      contents: write
    uses: ./.github/workflows/production.yml
    with:
      tag: ${{ github.ref_name }}

  create-release:
    needs: [publish-github, publish-npm, update-production]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-pnpm
        with:
          cache: 'false'

      # Tags through v1.887.0 predate automatic GitHub Releases and must not block the first new one.
      - name: Publish GitHub Release
        run: pnpm josh release:github
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_START_TAG: v1.887.0
          RELEASE_WORKFLOW: publish.yml
          RELEASE_JOBS: pack,publish-github,publish-npm,update-production
