name: Publish

on:
  repository_dispatch:
    types: [new-tag-created]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@joshuafolkken'

      # Install pnpm via Corepack instead of pnpm/action-setup: its self-installer
      # crashes on newer pnpm releases with "Cannot use 'in' operator to search for
      # 'integrity' in undefined" (#662).
      - run: corepack enable

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm publish --no-git-checks --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
