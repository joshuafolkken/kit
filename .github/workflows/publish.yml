name: Publish
run-name: Publish ${{ github.ref_name }}

# auto-tag.yml starts this workflow with `gh workflow run publish.yml --ref <tag>`, so the run's
# commit and ref are the release tag's. npm provenance records the run's commit from the OIDC token,
# and a repository_dispatch run is pinned to the default branch head, which can be newer than the tag.
on:
  workflow_dispatch:

jobs:
  publish-github:
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: package-publish
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@joshuafolkken'

      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          version=$(node -p "const m = require('./package.json'); m.packageManager?.match(/^pnpm@([^+]+)/)?.[1] ?? (m.devEngines?.packageManager?.name === 'pnpm' ? m.devEngines.packageManager.version?.split('+')[0] : 'latest') ?? 'latest'")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          install: false

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Select GitHub Packages tag
        id: publish-tag
        run: |
          version=$(node -p "require('./package.json').version")
          latest=$(cd "$RUNNER_TEMP" && npm view @joshuafolkken/kit dist-tags.latest --registry https://npm.pkg.github.com)
          tag=$(pnpm exec tsx scripts/release/publish-tag-cli.ts "$version" "$latest")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm publish --no-git-checks --tag ${{ steps.publish-tag.outputs.tag }} --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: package-publish
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          version=$(node -p "const m = require('./package.json'); m.packageManager?.match(/^pnpm@([^+]+)/)?.[1] ?? (m.devEngines?.packageManager?.name === 'pnpm' ? m.devEngines.packageManager.version?.split('+')[0] : 'latest') ?? 'latest'")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          install: false

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm pack --out "$RUNNER_TEMP/kit.tgz"

      - name: Select npm tag
        id: publish-tag
        run: |
          version=$(node -p "require('./package.json').version")
          latest=$(cd "$RUNNER_TEMP" && npm view @joshuafolkken/kit dist-tags.latest --registry https://registry.npmjs.org)
          tag=$(pnpm exec tsx scripts/release/publish-tag-cli.ts "$version" "$latest")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: cd "$RUNNER_TEMP" && npm publish kit.tgz --access public --tag ${{ steps.publish-tag.outputs.tag }} --registry https://registry.npmjs.org --userconfig /dev/null

  update-production:
    needs: [publish-github, publish-npm]
    permissions:
      contents: write
    uses: ./.github/workflows/production.yml
    with:
      tag: ${{ github.ref_name }}

  create-release:
    needs: [publish-github, publish-npm, update-production]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          version=$(node -p "const m = require('./package.json'); m.packageManager?.match(/^pnpm@([^+]+)/)?.[1] ?? (m.devEngines?.packageManager?.name === 'pnpm' ? m.devEngines.packageManager.version?.split('+')[0] : 'latest') ?? 'latest'")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          install: false

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish GitHub Release
        run: pnpm exec tsx scripts/release/github-release-cli.ts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
