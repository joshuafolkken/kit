name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
# A push run is grouped by the commit it carries, so a later push to main never cancels an earlier
# one; without the sha every push to main shares one group and the run for the commit that changed
# the version could be cancelled. The sha is added for `push` only so that a new push to a pull
# request still cancels that pull request's older, superseded scans — the saving this block exists
# for (joshuafolkken/kit#2025). Kept in the same form as ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true
jobs:
  sonarqube:
    name: SonarQube
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          # Wait for the SonarCloud Quality Gate and fail this job (a required PR check) when the
          # gate is red, so a PR that introduces a Maintainability / code-smell finding cannot be
          # merged green. Without this flag the scan only uploads results and never blocks.
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
