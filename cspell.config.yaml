  # `shutil.copy`/`shutil.move` into an existing path. They appear only in that module's patterns and tests.
  - writelines
  - shutil
  # English word in `scripts/rules/worktree-guard.ts` — a message-tagged stash is "findable and poppable"
  # by `pnpm josh stash:pop` (joshuafolkken/kit#2120). Appears only in that module's comment.
  - poppable
  # The ESTree property name for a template literal's static string chunks (`node.quasis`), read by
  # `eslint/rules/english-only-prose.js` when it inspects a no-substitution template title
  # (joshuafolkken/kit#2124). It is the AST spelling, not a coined word.
  - quasis
  # OSV-Scanner's own package-extraction library, named in the `--version` banner the scanner floor
  # parses (joshuafolkken/kit#2200). It appears only in `scripts/security/security-audit-provision-logic.ts`
  # and its suite, both internal to this package.
  - scalibr
  # A binary that cannot be spawned at all (ENOENT), described in `scripts/security/security-audit.ts`'s
  # comment on why a version that cannot be read is treated as below the floor (joshuafolkken/kit#2200).
  # The negated form of "able to be spawned", which cspell does not derive from "spawn".
  - unspawnable
  # Verb coined for turning a bare `#N` into a number-link at the source that prints it — the citation
  # formatter `issue_citation.linkify` in `scripts/rules/issue-citation.ts` (joshuafolkken/kit#2329).
  # It and its inflections appear only in that module, the printing commands, and their suites.
  - linkify
  - linkified
  - linkifies
