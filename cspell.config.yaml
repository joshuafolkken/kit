  - disjointness
  # Verb coined from Node's working-directory-change call — "the lane case chdirs into a lane checkout".
  # The guard suites
  # for joshuafolkken/kit#2138 change directory into a lane checkout to exercise the dispatched-child
  # path, and the teardown comments name that act.
  - chdirs
  # "A copy still matches after reindentation" — `josh clone:scan` normalizes whitespace before it
  # fingerprints a block, so a block copied and reindented (its leading whitespace changed) still
  # hashes the same (joshuafolkken/kit#2217). Named in the clone-detection code and its tests.
  - reindent
  - reindented
  - reindentation
  # "An unenumerated guard fires" — a guard not listed in the `lane-guard-policy.ts` enumeration
  # (joshuafolkken/kit#2138). Names the fail-safe default in the code comment and its test.
  - unenumerated
  # Coined for the retirement of `josh cost` reports no rule or decision read (#2016): a column,
  # scope or module is "readerless" when nothing consumes its value. Used in the CLI comments, the
  # tests and `docs/josh-commands.md` to name what was removed and why the `--over` verdict stays.
  - readerless
  # "The section intro cites the same words unbolded" — the prompt-sync test comment contrasts the
  # bold header it matches against the plain (unbolded) mention nearby (joshuafolkken/kit#2255).
  - unbolded
  # "A safety net not firing is not a miscalibration" — the pre-gate-cut decision heading for
  # joshuafolkken/kit#2282 names the threshold-tuning question it declines to treat as an error.
  - miscalibration
  # "halving it moves the unsimulated parent hand-off too" — the pre-gate-cut decision for
  # joshuafolkken/kit#2366 names the three shared uses of CONTEXT_CUT_THRESHOLD the lane simulation
  # did not price.
  - unsimulated
  # Wrapped in backticks, as a past participle. `josh epic --add` writes the relation it replaced into
  # the decision record with the chain in a code span, because a line that is nothing but `#A -> #B` is
  # read as a dependency declaration anywhere in an epic body (joshuafolkken/kit#1711) — the code and
  # the docs both have to say why the span is there.
  - backticked
  # The highest-but-one effort level the agent CLI accepts, between `high` and `max`. It is one of the
  # `--effort` values a dispatched lane child is allowed (joshuafolkken/kit#1932), so `detached-launch.ts`
  # names it in its allowlist and the docs quote the full set verbatim.
  - xhigh
  # The system call that replaces a process image, which is what `spawn` reaches without a shell.
  # `run-wake-session.ts` names it to say why a NUL byte in an argument is the one character that has
  # to be rejected: it terminates the string there, so the argument that runs is a prefix of the one
  # that was checked (joshuafolkken/kit#1719).
  - execve
  # The C library call Node names in a name-resolution failure, and the error code it carries. The
  # `backlog:next` reference quotes one verbatim as the failure that used to be reported as an
  # unusable dependency graph (joshuafolkken/kit#1663) — the literal text a reader greps for.
  - getaddrinfo
  - ENOTFOUND
  # "Re-dispatchable" — a lane child that ended on an API outage is left dispatchable again in the same
  # run rather than parked (joshuafolkken/kit#2240). Named across the `run:merge` / `run:ending` code,
  # the workflow docs and their tests.
  - dispatchable
  # "Undispatched" — ready backlog work that sits with a free lane while nothing is started, the stall
  # state the detector reports (joshuafolkken/kit#2359). Named across the `backlog:stalled` code, its
  # command descriptions, the stall event/notify strings and the docs.
  - undispatched
  # The connection-error signature the Anthropic client emits when the API refused the socket, matched
  # mechanically to tell an API outage apart from a child that stalled (joshuafolkken/kit#2240). It is
  # the literal marker text `api-outage.ts` greps the exit record for.
  - connectionrefused
  # The registry host `docs/cloud-session.md` lists among the outbound hosts a cloud container has to
  # allow (joshuafolkken/kit#1565). It is the domain `registry.npmjs.org`, not a prose word.
  - npmjs
  # The mount option that refuses to execute anything on a filesystem. `security-audit.ts` names it
  # as one of the reasons a provisioned osv-scanner can exist and still not be runnable
  # (joshuafolkken/kit#1563), which is why existence alone is not the check.
  - noexec
  # git's own spelling of the `commit.gpgsign` config key, carried on `-c` by the throwaway
  # repository `lane-change-base.test.ts` builds so a signing setup on the machine cannot fail its
  # commits.
  - gpgsign
  # git's own name for the log of where a ref has been. It is the only evidence joshuafolkken/kit#1530
  # left behind, and `test-repository-guard.ts` cites it three times as the reason the guard has to
  # name what it caught.
  - reflog
  # git's own name for the `--numstat` diff format — added/deleted line counts per file, tab-delimited.
  # `josh split:assess` reads it to size a change (joshuafolkken/kit#2218).
  - numstat
  # What `josh review:attest` calls a review that read a checkout other than the one it was briefed
  # on (joshuafolkken/kit#1522). cspell derives "targeted" but not the "mis-" compound.
  - mistargeted
  # To price something wrongly. `cost-dollar-composition.ts` uses it to say why one blended rate over
  # models of different prices would misprice both — cspell derives "price" but not the "mis-" compound.
  - misprice
  # The things that depend on a given one — British spelling of "dependents". `epic-next-views.ts` uses
  # it for the issues a blocked or parked issue holds up for a person to resolve.
  - dependants
  # `git rev-parse --show-toplevel`, quoted in `docs/josh-commands.md` as the source of the checkout
  # root the review brief prints. git's own spelling of the flag.
  - toplevel
  # What `josh lint:related` calls a file the two linters read (joshuafolkken/kit#1298), matching
  # the "relatable" the sibling unit narrowing already uses for a file a test can import.
  - lintable
  # The shell tokens `time-shell.ts` drops before keying a check by its arguments
  # (joshuafolkken/kit#1383). The plural is what cspell's dictionaries do not derive.
  - redirections
  # What the gate's caches exist to stop it doing (joshuafolkken/kit#1256). Both forms are needed:
  # cspell's dictionaries do not derive one from the other.
  - rescan
  - rescanned
  # What `time-phases.ts` calls a span belonging to no phase at all (joshuafolkken/kit#1299). It
  # stays in this local list because it reaches no distributed file; the `wrapup` beside it in the
  # same change does, so that one is in `cspell/index.yaml` instead.
  - unphased
  # What `time-batch.ts` calls a batch row with no duration to print — a run the batch never reached,
  # and one whose report could not be built at all (joshuafolkken/kit#1352). `unstarted` is the word
  # its counterpart uses for the first of those alone. Neither reaches a distributed file.
  - untimed
  - unstarted
  # What `propagate-git-failure.ts` calls a branch `josh git` committed to and could not push — the
  # state a consumer's pre-push hook leaves behind (joshuafolkken/kit#1417). It reaches no
  # distributed file: the word appears only in that module's own unit suite.
  - unpushed
  # What `time-ci.ts` does with a CI cycle the merge command sat waiting for: it moves from the
  # `merge` phase to `ci` (joshuafolkken/kit#1384). All three forms are needed — cspell's
  # dictionaries derive none of them from another — and none reaches a distributed file.
  - reattribute
  - reattributed
  - reattribution
  # The shell builtins `josh time` walks past when it names the command a Bash call actually ran
  # (joshuafolkken/kit#1267). They reach no distributed file, so they stay in this local list.
  - pushd
  - popd
  - subshell
  # How a session that never calls `Edit` or `Write` rewrites a file — the mode the density hook's
  # matcher was widened to reach (joshuafolkken/kit#1337). Named in `docs/` and in a test file,
  # neither of which `josh sync` copies, so it stays in this local list.
  - heredocs
  - dedup
  - keepalive
  - refspec
  - pathspec
  - issuecomment
  - frontmatter
  - toolkits
