  - noemit
  - unstub
  - appleboy
  - vercel
  - winget
  - packument
  - EBADDEVENGINES
  - sonarlint
  - inlines
  - extensionless
  - triaging
  - mnemecha
  - waneccha
  - ENOENT
  # The errno a `--stop` gets when it may not signal the supervisor it just unrecorded
  - EPERM
  - ELIFECYCLE
  # The id prefix the API gives a tool_use block. The eval suite's directory name, `evals`, is in
