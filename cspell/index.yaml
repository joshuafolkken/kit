  # Words the skills `josh sync` copies into a consumer use. They belong here rather than in kit's
  # own `cspell.config.yaml`, because a consumer spell-checks the copies and resolves them only
  # through this dictionary (joshuafolkken/kit#1092). `scripts/cspell-distributed-words.test.ts` is
  # what keeps the two in step.
  - worktrees
  # The singular joined it once `epicrun.md` had to name the git subcommand itself — `git worktree
  # add <dir> <existing-branch>`, the restore no `josh lane:*` command reaches (joshuafolkken/kit#1587).
  - worktree
  - evals
  # How `SKILL.md` → §2h and `eval-gate.md` name a command already sent to the background
  # (joshuafolkken/kit#1510). Both are skills `josh sync` copies, so the word has to resolve here.
  - backgrounded
