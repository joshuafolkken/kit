version: '0.2'
useGitignore: true
language: en
ignorePaths:
  - '**/.git/**'
  # joshuafolkken/kit#1114: where Claude Code puts its bridge work trees — a full checkout of the
  # project, on another branch, inside a directory this package ships. `useGitignore` above does not
  # reach them: git excludes them through `.git/info/exclude`, a per-checkout file that is never
  # committed and that nothing outside git reads. Left in, a spell check fails on a word introduced
  # by work on a different branch, in a file the current one does not contain — the same gap that
  # published them to npm until joshuafolkken/kit#1107 and linted them until joshuafolkken/kit#1112.
  # `**/` rather than a root anchor, because a monorepo puts a package's work trees under it.
  - '**/.claude/worktrees/**'
  # joshuafolkken/kit#1256: the verification gate's own cache files. `useGitignore` above covers
  # them in this repository, but the flags that write them ship in the same package version as this
  # file while the matching `.gitignore` entries only reach a consumer on its next `josh sync` — so
  # a consumer that upgrades and runs `pnpm josh gate` first has `josh cspell:dot` read whatever the
  # other checks just wrote: measured at 125 spelling issues from one build-info file, with nothing
  # misspelled in the tree. Naming them here makes the exclusion independent of that ordering. The
  # build-info file appears only where the type check falls through to `josh check`; a project whose
  # type check resolves to `josh-app check:ci` never writes one, and `.eslintcache` is written
  # everywhere.
  # joshuafolkken/kit#1332: the edit hook's own eslint cache, written wherever the hook runs. It is
  # separate from `.eslintcache` above so that a hook run cannot delete the gate's copy, or overwrite
  # it while the gate is linting the whole tree beside the review.
  # joshuafolkken/kit#1347: `josh lint:related` has its own for the same reason — an implementation
  # loop calls it while the gate lints the whole tree, and two eslint runs on one cache file discard
  # each other's entries.
  - '**/.eslintcache'
  - '**/.eslintcache.edit'
  - '**/.eslintcache.related'
  - '**/.tsbuildinfo'
  - '**/.cspellcache'
  - '**/.gitignore'
  - '**/pnpm-lock.yaml'
  - '**/.vscode/**'
  - '.wrangler/**'
  - '.coderabbit.yaml'
  #   - '**/*.d.ts'
  #   - '**/*.map'
  #   - '**/*.min.js'
  #   - '**/*.svg'
