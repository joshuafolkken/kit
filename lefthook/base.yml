pre-commit:
  parallel: true
  commands:
    prevent-main-commit:
      skip: git diff --cached --quiet
      run: pnpm josh prevent-main-commit

    cspell:
      glob: '*.{ts,tsx,js,jsx,md,mdx,html,css,scss,yml,yaml,json,properties}'
      run: pnpm exec cspell lint --no-must-find-files --no-progress {staged_files}

    # Scans only staged files, so a secret is caught before it ever enters history —
    # GitHub push protection and the CodeRabbit gitleaks pass both fire after the fact,
    # and push protection covers only known provider patterns.
    # Routed through `josh secretlint-scan` rather than a bare `pnpm exec secretlint`:
    # secretlint resolves from the consumer project, not from kit, so upgrading kit activates
    # this hook one `josh sync` + `pnpm install` ahead of the binary — and the bare form turns
    # that window into a hard failure on every commit (kit#695). The wrapper skips with an
    # actionable notice instead, and owns the CLI flags (`--no-glob` and friends).
    secretlint:
      run: pnpm josh secretlint-scan {staged_files}

    prettier:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,html,css,scss,md,mdx,json,jsonc,yaml,yml}'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

    eslint:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      run: pnpm exec eslint --quiet --cache --cache-strategy content {staged_files}

    type-check:
      glob: '*.{ts,js,mjs,cjs}'
      run: pnpm exec tsc --noEmit

  fail_text: |
    🚫 Commit blocked due to quality checks failure
    Please fix the issues above and try again.

    Quick fixes:
    • Run `josh format` to auto-format code
    • Run `josh lint` to check and fix linting issues
    • Run `pnpm exec tsc --noEmit` to verify TypeScript types

commit-msg:
  commands:
    check-commit-message:
      run: pnpm josh check-commit-message {1}

pre-push:
  # Sync dependencies ONCE, before the parallel commands start (kit #813). Every command below
  # runs through pnpm, and pnpm re-checks that node_modules matches package.json before running
  # anything — a check that fires on ~every push because `josh bump` rewrites package.json right
  # before the commit. Without this barrier all three commands (`audit`, `test-unit`, and the
  # consumer's own preview-owning command) detect the drift at once and each starts its own
  # install, so `node_modules/.bin` is being torn down and rebuilt while tests execute against it
  # — observed as `Failed to create bin at .../node_modules/.bin/playwright ENOENT` in a run whose
  # specs all passed when re-run alone. Measured: with package.json desynced, one `pnpm install`
  # here leaves the following commands with nothing to install.
  #
  # `setup` is the right hook for this because it is a separate key from `commands`, so a
  # consumer's own pre-push commands still merge in unchanged — unlike restructuring this section
  # into `jobs`, which would change the merge surface for every consumer at once.
  #
  # A failing setup does NOT abort the hook: lefthook logs `Failed to run setup` and runs the
  # commands anyway. That is intentional here — this barrier is an optimization, not a gate. If it
  # fails the dependencies are still out of sync, so each command falls back to installing on its
  # own exactly as it did before, and a genuinely broken tree still fails the push from inside a
  # command. Never move a correctness check into `setup`; its failure would be a warning only.
  setup:
    - run: pnpm install
  # Parallel is SAFE as of kit #676. The old collision was two pre-push commands that each
  # built + booted their own preview server on the same fixed port (4173) — historically
  # app-kit's separate `test-e2e` + `dast` — running at once. That is gone: app-kit #97
  # (v0.39.0) unified them into ONE `verify` command that owns the single server, and every
  # older consumer runs only a single preview-owning command (`test-e2e`). `audit` and
  # `test-unit` own no server, so with at most one server-owner per consumer nothing collides.
  # This flag is a blanket, non-overridable distribution: on a lefthook section collision the
  # extended base wins, so a consumer's own `parallel: true/false` is silently dropped — the
  # decision has to be made here, for everyone at once. It is therefore only safe while NO
  # consumer has 2+ preview-owning pre-push commands sharing a port. Audited at flip time
  # (kit #676): app-kit, joshuafolkken-com, game-kit, mnemecha, waneccha — all ≤1 server-owner.
  # Revert to `false` if a consumer reintroduces two colliding preview-owning pre-push
  # commands and cannot unify them (the app-kit #97 pattern: one command owns build + preview,
  # the others are HTTP clients), or if a consumer measures a regression / new flake.
  # The #676 audit covered preview servers only, not the concurrent installs of #813 — that
  # second collision is what the `setup` barrier above removes, so it is not a reason to flip
  # this back. Removing the barrier while leaving this `true` reopens #813.
  parallel: true
  commands:
    audit:
      run: pnpm josh audit

    test-unit:
      run: pnpm exec vitest run

  fail_text: |
    🚫 Push blocked due to test failures or audit issues
    Please resolve the issues above before pushing.

    Troubleshooting:
    • Run tests locally: `josh test:unit`
    • Run audit locally: `josh audit`
