allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  workerd: true
  '@joshuafolkken/kit': false # project postinstall handles lefthook install

# pnpm 12 reads these settings from this file only; the same lines in .npmrc are ignored (kit #3267).
# A release must be a day old before pnpm resolves it, and an unsatisfied `engines` fails the install.
minimumReleaseAge: 1440
engineStrict: true

# Skip the install-time supply-chain re-verification of the already-committed, reviewed lockfile.
# Since pnpm 11.5, `minimumReleaseAge` can trigger a pre-install metadata re-fetch; on clean CI boxes
# (e.g. Cloudflare Workers Builds) it can't authenticate private @joshuafolkken/* GitHub Packages,
# producing a false ERR_PNPM_TARBALL_URL_MISMATCH. minimumReleaseAge still applies at resolution
# time, so age protection is preserved — only the per-install re-check of a trusted lockfile is skipped.
trustLockfile: true

# Security fixes often require same-day vite releases; minimumReleaseAge would block them.
# Nothing else is excluded: `tsx` runs every `josh` command, so it waits out the window like any
# other dependency (kit #3602).
#
# `josh init` / `josh sync` mirror this list to Safe Chain's .aikido project config (kit #2618).
# Older Safe Chain shims ignore .aikido and can still hide an excluded release. `josh ranges`
# checks published dependency ranges through that filtered view before a release (kit #742).
minimumReleaseAgeExclude:
  - vite

overrides:
  svelte: ^5.55.7
  # An indirect dep a within-range re-resolution could not lift past its parents' pins, floored at the
  # smallest release clearing its OSV advisory (joshuafolkken/kit#2200; user-approved 2026-09-21 to
  # override indirect packages). A caret so `josh latest`'s re-resolution keeps it current within the
  # major without reintroducing the advisory. The devalue, postcss and nanoid floors were removed once
  # their parents' ranges exceeded them (joshuafolkken/kit#3091).
  vite: ^8.0.16 # OSV — vite 8.0.8 → 8.0.16
