# Written by `josh init` for a static project (joshuafolkken/kit#2693). kit's CLI runs on tsx, which
# depends on esbuild, and pnpm fails an install whose dependencies carry an unapproved build script.
# unrs-resolver arrives through kit's optional ESLint import peers (joshuafolkken/kit#2785).
allowBuilds:
  esbuild: true
  unrs-resolver: true

# pnpm 12 reads these settings from this file only; the same lines in .npmrc are ignored (kit #3267).
minimumReleaseAge: 1440
engineStrict: true
