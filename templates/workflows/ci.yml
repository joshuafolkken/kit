name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-image:
    name: Resolve Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      # JSON consumed via fromJSON() as the job-level `container` value: an object
      # when the image exists, the literal `null` when it does not (= no container).
      container: ${{ steps.resolve.outputs.container }}
      # 'true' only when Playwright is a dependency but its image is unavailable, i.e.
      # exactly when a job must download browsers itself.
      should_install_browsers: ${{ steps.resolve.outputs.should_install_browsers }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The MCR image lags the npm publish by days, so a version-derived tag is not
      # guaranteed to exist. Probe it first and fall back to a plain runner instead of
      # emitting a tag that 404s and kills every dependent job before it starts.
      - name: Resolve image
        id: resolve
        run: |
          # Whitelist the characters: the value lands in $GITHUB_OUTPUT as JSON, so a
          # newline or quote smuggled into the manifest could forge an extra output line.
          version=$(node -p "require('./package.json').devDependencies?.['@playwright/test'] ?? ''" | tr -cd 'A-Za-z0-9.-')

          if [ -z "${version}" ]; then
            echo 'container=null' >> "$GITHUB_OUTPUT"
            echo 'should_install_browsers=false' >> "$GITHUB_OUTPUT"
            echo 'Playwright is not a dependency; every job runs on the plain runner.'
            exit 0
          fi

          tag="v${version}-noble"
          image="mcr.microsoft.com/playwright:${tag}"
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://mcr.microsoft.com/v2/playwright/manifests/${tag}" || true)

          if [ "${status}" = '200' ]; then
            printf 'container={"image":"%s","options":"--user root"}\n' "${image}" >> "$GITHUB_OUTPUT"
            echo 'should_install_browsers=false' >> "$GITHUB_OUTPUT"
            echo "Resolved Playwright container image ${image}."
          else
            echo 'container=null' >> "$GITHUB_OUTPUT"
            echo 'should_install_browsers=true' >> "$GITHUB_OUTPUT"
            echo "::warning::Playwright image ${image} could not be resolved on MCR (HTTP ${status}). Running on the plain runner and installing browsers with 'playwright install --with-deps' instead."
          fi

  checks:
    name: Checks
    needs: playwright-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container: ${{ fromJSON(needs.playwright-image.outputs.container) }}
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      # Install pnpm via Corepack (driven by the packageManager pin) instead of
      # pnpm/action-setup: its self-installer crashes on newer pnpm releases with
      # "Cannot use 'in' operator to search for 'integrity' in undefined" (#662).
      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Setup pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: eslint-cache
        with:
          path: |
            .eslintcache
          key: ${{ runner.os }}-eslint-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('eslint.config.js', 'eslint/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-eslint-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-eslint-cache-

      - name: Setup safe-chain
        run: pnpm dlx @aikidosec/safe-chain@1.5.1 setup-ci

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run spell check
        run: pnpm exec cspell . --dot

      - name: Prepare
        run: pnpm prepare

      - name: Run type check
        run: pnpm exec svelte-kit sync && pnpm exec svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: Run prettier check
        run: pnpm exec prettier --check .

      # Build before eslint so generated outputs exist for type-aware linting.
      # The same build output is reused by the size check below.
      - name: Build
        run: pnpm build

      - name: Run eslint check
        run: pnpm exec eslint . --cache --cache-strategy content

      # Vitest browser-mode projects (*.svelte.test.ts) drive a real Playwright browser,
      # which the container image ships but a plain runner does not. Same guard as e2e.
      - name: Install Playwright browsers
        if: needs.playwright-image.outputs.should_install_browsers == 'true'
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Run unit tests
        run: pnpm josh test:unit

      - name: Check bundle size
        run: pnpm size-limit

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run security audit
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: --lockfile=pnpm-lock.yaml

  e2e-detect:
    name: Detect E2E
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check for Playwright config
        id: check
        run: |
          if [ -f playwright.config.ts ] && find tests src/routes \( -name "*.e2e.ts" -o -name "*.e2e.js" \) 2>/dev/null | grep -q .; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E
    needs: [playwright-image, e2e-detect]
    if: needs.e2e-detect.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container: ${{ fromJSON(needs.playwright-image.outputs.container) }}
    timeout-minutes: 10
    # Playwright preview は localhost:4173。ワークフロー共通の BETTER_AUTH_URL（本番）を
    # 引き継ぐと Better Auth が origin を拒否する（CI E2E では本番 URL は使わない）。
    # ホスト/ポートは playwright.config.ts の PREVIEW_PORT（4173）と一致させること。
    env:
      BETTER_AUTH_URL: http://localhost:4173
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      # Install pnpm via Corepack (driven by the packageManager pin) instead of
      # pnpm/action-setup: its self-installer crashes on newer pnpm releases with
      # "Cannot use 'in' operator to search for 'integrity' in undefined" (#662).
      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Setup pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build-cache
        with:
          path: |
            .svelte-kit
          key: ${{ runner.os }}-build-cache-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('svelte.config.js', 'vite.config.ts', 'tsconfig.json', 'src/lib/server/auth.ts') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-cache-e2e-

      - name: Setup safe-chain
        run: pnpm dlx @aikidosec/safe-chain@1.5.1 setup-ci

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Only needed on the fallback path: the container image already ships browsers
      # matching its own Playwright version. Invoked through the local bin rather than
      # `pnpm exec` because Sonar's S6505 misreads `pnpm ... install` as a package
      # install missing --ignore-scripts (this downloads browser binaries, not packages).
      - name: Install Playwright browsers
        if: needs.playwright-image.outputs.should_install_browsers == 'true'
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  notify-auto-tag:
    name: Notify Auto Tag
    needs: [checks, security, e2e-detect, e2e]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.checks.result == 'success' &&
      needs.security.result == 'success' &&
      needs.e2e-detect.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dispatch auto-tag
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          event-type: ci-passed-on-main
          client-payload: '{"sha": "${{ github.sha }}"}'
