name: Dependabot auto-merge

on: pull_request

# One run per pull request, and a superseded one is cancelled rather than left to finish. Both halves
# of this workflow decide from the pull request as it stands — which files the diff touches, and who
# pushed — while `gh pr merge --auto` is state that outlives the run that set it. A run that has been
# overtaken is therefore deciding about a diff that no longer exists: it can arm auto-merge after a
# newer run already withdrew it, on a diff that newer run found upstream-managed, and nothing runs
# afterwards to undo that (joshuafolkken/kit#842). `github.ref` is the pull request's own merge ref,
# so the group is per pull request and one bump never waits on another's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Gated on who opened the pull request, not on who triggered this run. `github.actor` names the
  # latter, so a push by anyone other than Dependabot — a maintainer rebasing the branch by hand, or
  # amending the bump — skipped the whole job. That mattered once the job acquired something to undo:
  # `gh pr merge --auto` is state on the pull request, so a run that never happens cannot withdraw an
  # auto-merge an earlier run armed, and the bump merges itself the moment the checks go green
  # (joshuafolkken/kit#838). The author is the stable fact about a Dependabot pull request; arming is
  # what stays restricted to Dependabot's own events, on the step below.
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Whether the pull request touches a workflow some upstream package overwrites. Decided from
      # the changed files because Dependabot's metadata cannot answer it: for the github-actions
      # ecosystem it reports one `directory` for the whole repository and never names the workflow
      # file it bumped.
      #
      # The answer is read off each file rather than looked up in a list of paths. A list can only
      # describe what the package holding the list distributes, and this repository may receive
      # workflows from more than one: kit writes `ci.yml`, and a package built on kit writes its own
      # alongside it. Neither knows the other's set, and whichever `sync` ran last would decide a
      # shared list — so the list drifts from the files it claims to describe and the merge/revert
      # loop joshuafolkken/kit#836 closed reopens one tier down (joshuafolkken/kit#844). A stamp
      # written by the package that overwrites the file cannot drift from it, and composes across any
      # number of distribution tiers without the distributors having to agree on anything.
      #
      # It runs before the metadata step so that the withdrawal below is reached on every run.
      # `dependabot/fetch-metadata` fails the job when the first commit is not Dependabot's or is
      # unsigned — a hand-amended branch, for instance — and a failed step takes every step after it
      # with it, which would leave exactly the armed auto-merge this job exists to withdraw.
      #
      # Everything comes from the API, so no checkout is needed. `--paginate` is what makes the file
      # list complete rather than the first page of a large diff, and the `select` narrows it to
      # workflows inside `--jq` rather than through `grep`: the default shell is `bash -e` without
      # `pipefail`, so a `gh` failure inside a pipeline would be masked by grep's status, and grep
      # itself answers 1 for "no match" and 2 for "I could not look" — two readings this step must
      # not conflate, since one of them means "merge it" (joshuafolkken/kit#844). An assignment
      # carries the command's status, and `case` has no failure mode at all.
      #
      # Each file is read through the `contents_url` the same response supplies, rather than a URL
      # built from the path here. GitHub has already encoded it, and it already points at this pull
      # request's head — a path composed by hand would break on the first workflow whose name
      # contains a space or a `#`, and every read failing means every bump is held back for good.
      #
      # The stamp is matched at the start of the file, not anywhere in it, because this workflow
      # declares the token in its own `env` in order to match on it — a substring test would call
      # every copy of this file managed for the wrong reason, and would say nothing about files that
      # merely mention it.
      #
      # A file that cannot be read fails the step rather than answering. That covers a deletion, a
      # rate-limited API, a network failure and a response that carried no URL to read alike: none of
      # them is evidence that the consumer owns the file. Failing lands on the same safe side as
      # answering "managed" would — the step publishes no output, so the withdrawal below still runs
      # under `!cancelled()` and the arming step still cannot — and it lands there visibly. Answering
      # instead would withdraw a previously armed auto-merge on a green job, with nothing to look at
      # and no retry until the next push; this call runs once per changed workflow, so the case is not
      # rare enough to leave silent.
      #
      # `gh`'s own stderr reaches the job log rather than being discarded, because the causes are not
      # equally interesting and the step cannot tell them apart: a deletion is routine, a 403 means
      # every bump in this repository is being held back for a reason someone has to fix.
      # Only stdout is captured, so the message cannot be mistaken for file content.
      - name: Check whether the pull request touches an upstream-managed workflow
        id: managed
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          MANAGED_MARKER: '# josh-managed-workflow:'
          GH_TOKEN: ${{ github.token }}
        run: |
          changed="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | select(.filename | startswith(".github/workflows/"))
                      | [.filename, .contents_url] | @tsv')"

          has_managed=false

          while IFS="$(printf '\t')" read -r file url; do
            [ -n "$file$url" ] || continue

            if [ -n "$url" ] &&
              content="$(gh api "$url" -H 'Accept: application/vnd.github.raw')"; then
              case "$content" in
                "$MANAGED_MARKER"*)
                  echo "$file is written by an upstream package — holding this bump back."
                  has_managed=true
                  break
                  ;;
              esac
            else
              echo "$file could not be read — refusing to decide." >&2
              exit 1
            fi
          done <<<"$changed"

          echo "has-upstream-managed=$has_managed" >>"$GITHUB_OUTPUT"

      # The counterpart of the gate on the merge step below. That gate only declines to arm
      # auto-merge; it cannot un-arm one, and `gh pr merge --auto` persists on the pull request until
      # something withdraws it. So this step withdraws it on every run that is not entitled to arm it:
      # the condition here is the negation of the one the metadata step below carries, which is what
      # decides whether a run may consider arming at all (joshuafolkken/kit#840).
      #
      # Writing that as a negation rather than as its own list of cases is what keeps the two halves
      # from drifting apart. Both known routes into an armed pull request nobody re-approved are the
      # same shape — a run that cannot arm: a diff that started outside the managed set and later
      # grew an upstream-managed workflow (joshuafolkken/kit#838), and a branch someone other than
      # Dependabot pushed to, whose commits nobody reviewed as part of the bump. Enumerating them
      # left the second one uncovered for a diff kit never overwrites, which is the whole of #840.
      #
      # The merge step carries two further clauses — the ecosystem and the semver level — that this
      # negation deliberately leaves out. Those are facts about the bump rather than about the run,
      # and they do not change over a pull request's life, so anything that was ever armed already
      # satisfied them; re-deciding them here would only make the withdrawal skip runs it must reach.
      #
      # `!cancelled()` is what makes the step reachable when the check above fails — a `gh api` call
      # that did not answer at all, for instance. A failed step publishes no
      # outputs, so `has-upstream-managed` reads as the empty string, the negated condition holds, and an
      # undecided diff falls to the safe side. Without it the job would stop at the failure with the
      # auto-merge still armed — and this workflow is not a required check, so a red run of it does
      # not hold the merge back on its own. `always()` would reach one run more, a cancelled one,
      # where the check was interrupted rather than answered: there the same empty output would
      # withdraw an auto-merge that was armed legitimately and that nothing re-arms without a new
      # push. A cancelled run changes nothing about the pull request, so it has nothing to undo.
      #
      # The armed state is read first because `--disable-auto` is an error, not a no-op, on a pull
      # request that has no auto-merge enabled: the usual case here — a bump that was never armed —
      # would fail the job on every run. `autoMergeRequest` is null exactly when nothing is armed.
      - name: Withdraw auto-merge unless this run would arm it
        id: withdraw
        if: >-
          !cancelled()
          && !(github.actor == 'dependabot[bot]'
          && steps.managed.outputs.has-upstream-managed == 'false')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          armed="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"

          if [ "$armed" != 'true' ]; then
            echo 'Auto-merge is not enabled on this pull request — nothing to withdraw.'
            exit 0
          fi

          gh pr merge --disable-auto "$PR_URL"

      # Skipped whenever the merge step below cannot run anyway — for an upstream-managed diff, and for a
      # run someone other than Dependabot triggered. This action fails the job outright when it
      # cannot read Dependabot metadata, which it cannot on a branch whose first commit is no longer
      # Dependabot's: a maintainer amending or rebasing the bump by hand. Running it there would turn
      # the job the wider guard above lets through into a red check on their pull request, so the
      # actor is checked here as well as on the merge step.
      #
      # This condition is also the workflow's one statement of which runs may arm auto-merge at all,
      # which the withdrawal above negates verbatim — so a case added here is withdrawn there without
      # a second edit, and the two cannot disagree about it.
      - name: Fetch Dependabot metadata
        id: metadata
        if: >-
          github.actor == 'dependabot[bot]'
          && steps.managed.outputs.has-upstream-managed == 'false'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      # `dependency-type` cannot separate the ecosystems: Dependabot reports github-actions updates
      # as `direct:production`, the same value it reports for npm production dependencies, so
      # `package-ecosystem` is the only usable discriminator (joshuafolkken/kit#802).
      #
      # github-actions patch and minor bumps merge unattended, but only in a workflow this
      # repository owns — those pins are real updates nobody else maintains. A bump to a
      # workflow an upstream package writes is left open instead: that package's `sync` is what
      # updates those pins, and it bumps them at the source, so merging here would only start the
      # loop described above and cost a CI run on every round.
      #
      # `github.actor` is checked here rather than on the job, which is gated on the pull request's
      # author instead (see above). Arming is the half that must stay Dependabot's own: the job now
      # also runs for a push by someone else, and that push carries commits nobody reviewed as part
      # of the bump. Withdrawing auto-merge is safe from any actor; enabling it is not.
      #
      # npm bumps never auto-merge, at any semver level: the distributed `.github/dependabot.yml`
      # disables npm version updates (joshuafolkken/kit#803), so the only npm pull request that
      # reaches this workflow is a security advisory — which is exactly the kind a human should
      # read. Major bumps never auto-merge in either ecosystem.
      #
      # `gh pr merge --auto` needs the repository's own "Allow auto-merge" setting; without it the
      # step fails with `Auto-merge is not allowed for this repository`. `josh init`, `josh sync`
      # and `josh doctor` report that setting and print the command that enables it
      # (joshuafolkken/kit#834).
      #
      # `--match-head-commit` is what stops a superseded run from arming. The concurrency group at the
      # top cancels one, but cancellation is not instantaneous and a step already executing can still
      # finish — and this is the one step where finishing leaves state behind, so the group narrows
      # that race without closing it (joshuafolkken/kit#842). The flag reaches GitHub as the
      # auto-merge mutation's `expectedHeadOid`, which makes the arming itself conditional on the
      # head this run decided about still being the branch's: nothing can land between deciding and
      # arming, which reading the head here and then arming would still allow. A run whose branch
      # moved fails rather than arming — the honest outcome, and this workflow is not a required
      # check, so its red run holds nothing back while the run the new head started decides afresh.
      #
      # Only arming is guarded this way, the same asymmetry the actor gate above rests on: an
      # auto-merge withdrawn from a stale view has to be armed again, and until someone does the bump
      # simply sits open; one armed from a stale view merges code the decision was never about.
      - name: Enable auto-merge for github-actions patch and minor updates
        if: >-
          github.actor == 'dependabot[bot]'
          && steps.metadata.outputs.package-ecosystem == 'github_actions'
          && steps.managed.outputs.has-upstream-managed == 'false'
          && (steps.metadata.outputs.update-type == 'version-update:semver-patch'
          || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
