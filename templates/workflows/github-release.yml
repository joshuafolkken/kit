name: GitHub Release

# Creates the GitHub Release, with notes generated from `.github/release.yml`, for each tag
# `josh release` cuts (joshuafolkken/kit#3007). It starts when auto-tag.yml announces the tag; a
# repository with a Publish workflow gets its release once that workflow has succeeded for the tag,
# waited for inside `josh release:github`. A `workflow_run` on Publish is not used: a Publish run
# started by the GITHUB_TOKEN never fires one (joshuafolkken/kit#3138). kit's own release is the
# `create-release` job of its publish.yml, which runs the same `josh release:github`, so this file is
# distributed but never runs in kit.
on:
  repository_dispatch:
    types: [new-tag-created]

# Deliberately no `concurrency` block: a later tag waits inside `josh release:github` for the lower
# tag's release, so serializing the runs would leave the later run holding the slot the lower one needs.

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: write
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A repository with a Publish workflow waits for that workflow's `Publish <tag>` run to succeed
      # before releasing; the announcement is the only trigger, so one tag never starts two releases.
      - name: Select release tag
        id: release
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          if [ -f .github/workflows/publish.yml ]; then
            echo "workflow=publish.yml" >> "$GITHUB_OUTPUT"
            echo "await=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.release.outputs.tag != ''
        uses: ./.github/actions/setup-node

      - name: Configure GitHub Packages authentication for existing projects
        if: steps.release.outputs.tag != ''
        run: printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' >> "$HOME/.npmrc"

      - name: Setup pnpm and install dependencies
        if: steps.release.outputs.tag != ''
        uses: ./.github/actions/setup-pnpm
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'false'

      - name: Publish GitHub Release
        if: steps.release.outputs.tag != ''
        run: pnpm josh release:github
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_WORKFLOW: ${{ steps.release.outputs.workflow }}
          RELEASE_AWAIT_PUBLISH: ${{ steps.release.outputs.await }}
